name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete test and figure dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mathematical expression dependencies
        run: npm ci --ignore-scripts
      - name: Current Markdown formula rendering
        run: npm run check:math
      - name: Tests, configurable study and current-source evidence
        run: python tools/reproduce.py --config configs/quick.toml --out results/runs/ci --plots
      - name: Rendered figure checks
        run: python tools/check_figures.py --input results/runs/ci
      - name: Require every test to run
        run: python -c "import json; w=json.load(open('results/runs/ci/workflow.json')); assert w['tests_skipped']==0"
      - name: Saved experiment and documentation audit
        run: python tools/check_project.py
      - name: Figure and math receipts
        run: python tools/check_artifacts.py
      - name: Public files and history
        run: python tools/check_publication.py
      - name: Assessed release evidence
        run: python tools/check_release.py
      - name: Installed package in an isolated interpreter
        shell: bash
        run: |
          python -m venv .venv-install
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            study_python=.venv-install/Scripts/python.exe
          else
            study_python=.venv-install/bin/python
          fi
          "$study_python" -m pip install --no-deps .
          "$study_python" -I -m sharedkv study --config configs/quick.toml --out results/runs/installed --keys 6 --reads 8 --hot-requests 0 --trials 1 --modes consistent --vnodes 2
          "$study_python" -I -m sharedkv report --input results/runs/installed --require-current-source

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m sharedkv study --config configs/quick.toml --out results/runs/figures
      - run: python -m sharedkv report --input results/runs/figures --plots --require-current-source
      - run: python tools/check_figures.py --input results/runs/figures
      - run: python tools/visual_qa.py --input results/runs/figures
      - name: Architecture export dependencies
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Native architecture diagram and rendered labels
        run: python tools/export_architecture.py --out results/runs/architecture
