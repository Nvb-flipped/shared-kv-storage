name: Project checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and integration tests
        run: python -m unittest -v
      - name: Saved experiment and documentation audit
        run: python tools/check_project.py
      - name: Figure and math receipts
        run: python tools/check_artifacts.py
      - name: Public files and history
        run: python tools/check_publication.py
