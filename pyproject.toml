[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cisc3010-sharded-kv"
version = "0.3.0"
description = "A configurable local framework for studying key placement, migration and request skew"
authors = [{name = "Paco"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sharedkv = "sharedkv.__main__:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["sharedkv*"]
